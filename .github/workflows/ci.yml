name: ORION CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-menu01-and-build:
    name: Typecheck, Lint, Anti-Slop Guard, Tests & SSR Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check (Menu 01, 02, 03, 04, 05 & 06 modules and tests)
        run: |
          npx eslint --max-warnings 0 \
            src/lib/vehicle-topology.ts \
            src/lib/battery-analytics.ts \
            src/lib/fleet-filter.ts \
            src/lib/excel-export.ts \
            src/lib/obd-diagnostics.ts \
            src/lib/presence-analytics.ts \
            src/lib/config-validation.ts \
            src/components/hmi/ShowroomModule.tsx \
            src/components/hmi/VehicleTopologyMap.tsx \
            src/components/hmi/ComponentNodeInspector.tsx \
            src/components/hmi/FleetModule.tsx \
            src/components/hmi/WarmupQueueModule.tsx \
            src/components/hmi/DiagnosticsModule.tsx \
            src/components/hmi/PresenceModule.tsx \
            src/components/hmi/ConfigModule.tsx \
            src/components/hmi/CommandPaletteModal.tsx \
            src/components/hmi/OrionLogo.tsx \
            src/components/hmi/TopNav.tsx \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/routes/dashboard.tsx \
            src/test/battery-analytics.test.ts \
            src/test/menu01-topology.test.tsx \
            src/test/menu02-fleet.test.tsx \
            src/test/menu03-warmup.test.tsx \
            src/test/menu04-diagnostics.test.tsx \
            src/test/menu05-presence.test.tsx \
            src/test/menu06-config.test.tsx \
            src/test/live-integration.test.tsx
          npx eslint --quiet src/context/TelemetryContext.tsx src/components/hmi/primitives.tsx

      - name: Anti-Slop Guardrail (Zero Em Dash & Zero Math.sin in Menu 01, 02, 03, 04, 05 & 06)
        run: |
          node -e '
            const fs = require("node:fs");
            const files = [
              "DESIGN.md",
              "src/lib/vehicle-topology.ts",
              "src/lib/battery-analytics.ts",
              "src/lib/fleet-filter.ts",
              "src/lib/excel-export.ts",
              "src/lib/obd-diagnostics.ts",
              "src/lib/presence-analytics.ts",
              "src/lib/config-validation.ts",
              "src/context/TelemetryContext.tsx",
              "src/components/hmi/ShowroomModule.tsx",
              "src/components/hmi/VehicleTopologyMap.tsx",
              "src/components/hmi/ComponentNodeInspector.tsx",
              "src/components/hmi/FleetModule.tsx",
              "src/components/hmi/WarmupQueueModule.tsx",
              "src/components/hmi/DiagnosticsModule.tsx",
              "src/components/hmi/PresenceModule.tsx",
              "src/components/hmi/ConfigModule.tsx",
              "src/components/hmi/CommandPaletteModal.tsx",
              "src/components/hmi/OrionLogo.tsx",
              "src/components/hmi/primitives.tsx",
              "src/components/hmi/TopNav.tsx",
              "src/routes/__root.tsx",
              "src/routes/index.tsx",
              "src/routes/dashboard.tsx",
              "src/test/battery-analytics.test.ts",
              "src/test/menu01-topology.test.tsx",
              "src/test/menu02-fleet.test.tsx",
              "src/test/menu03-warmup.test.tsx",
              "src/test/menu04-diagnostics.test.tsx",
              "src/test/menu05-presence.test.tsx",
              "src/test/menu06-config.test.tsx",
              "src/test/live-integration.test.tsx",
              "src/styles.css"
            ];
            for (const f of files) {
              const text = fs.readFileSync(f, "utf8");
              if (text.includes("\u2014")) {
                console.error("Em dash found in " + f);
                process.exit(1);
              }
              if (f.startsWith("src/components/hmi/") && /\bMath\.sin\s*\(/.test(text)) {
                console.error("Synthetic Math.sin() found in " + f);
                process.exit(1);
              }
            }
            console.log("Anti-slop check passed on " + files.length + " files.");
          '

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build production bundle & Heroku SSR pre-render
        run: npm run build

      - name: Verify pre-rendered routes & PHP API bundle
        run: |
          test -s .output/public/index.html
          test -s .output/public/dashboard/index.html
          test -f .output/public/dipo_api/get_data.php
          echo "Verified .output/public pre-rendered HTML and dipo_api endpoints."
