name: ORION CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Frontend Verify (TypeScript, ESLint, Anti-Slop, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene & allowlist check
        run: npm run check:hygiene

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint full src coverage
        run: npm run lint:ci

      - name: Anti-Slop Guardrail (dynamic scan across DESIGN.md, styles.css, and src/)
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            function walk(dir) {
              const out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  out.push(...walk(full));
                } else {
                  out.push(full);
                }
              }
              return out;
            }

            const targets = [
              "DESIGN.md",
              "src/styles.css",
              ...walk("src").filter((f) => {
                const norm = f.replace(/\\/g, "/");
                return /\.(ts|tsx)$/.test(norm) && !norm.startsWith("src/components/ui/") && norm !== "src/routeTree.gen.ts";
              }),
            ];

            for (const file of targets) {
              if (!fs.existsSync(file)) continue;
              const content = fs.readFileSync(file, "utf8");
              if (content.includes("\u2014")) {
                throw new Error(`Em-dash (U+2014) violation found in ${file}`);
              }
              if (file.replace(/\\/g, "/").startsWith("src/components/hmi/") && file.endsWith(".tsx") && content.includes("Math.sin(")) {
                throw new Error(`Fake Math.sin oscillation found in ${file}`);
              }
            }

            const css = fs.readFileSync("src/styles.css", "utf8");
            if (!css.includes("Space Grotesk") || !css.includes("JetBrains Mono")) {
              throw new Error("src/styles.css must configure Space Grotesk and JetBrains Mono fonts");
            }
            console.log(`Anti-Slop Guardrail PASSED across ${targets.length} files.`);
          '

      - name: Run Vitest unit & integration suites
        run: npm test

  backend-php-verify:
    name: Backend PHP Verify (Composer, PHP 8.3 lint, Security Guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 and Composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, json, mbstring
          tools: composer:v2

      - name: Validate composer.json and composer.lock strictly
        run: composer validate --strict

      - name: Syntax check all PHP files in backend/dipo_api
        run: |
          for f in backend/dipo_api/*.php; do
            php -l "$f"
          done

      - name: Verify PHP security guards and secrets hygiene
        run: |
          if git ls-files --error-unmatch backend/dipo_api/.env >/dev/null 2>&1; then
            echo "FAIL: backend/dipo_api/.env must never be tracked by git"
            exit 1
          fi
          php -r '
            $migrate = file_get_contents("backend/dipo_api/migrate.php");
            if (strpos($migrate, "HTTP_X_MIGRATE_TOKEN") === false || strpos($migrate, "PHP_SAPI") === false) {
              fwrite(STDERR, "FAIL: migrate.php missing CLI or X-Migrate-Token guard\n");
              exit(1);
            }
            $db = file_get_contents("backend/dipo_api/db.php");
            if (strpos($db, "SCRIPT_FILENAME") === false || strpos($db, ".oriontelemetry.tech") === false) {
              fwrite(STDERR, "FAIL: db.php missing direct HTTP 403 guard or strict CORS suffix validation\n");
              exit(1);
            }
            echo "PHP security guards OK\n";
          '

  build-and-bundle-check:
    name: Production Build & Heroku Bundle Verification
    needs: [frontend-verify, backend-php-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production app and prepare Heroku bundle
        run: npm run build

      - name: Verify prerendered routes, .htaccess rules, and PHP whitelist
        run: |
          node -e '
            const fs = require("node:fs");

            for (const rel of [
              ".output/public/index.html",
              ".output/public/dashboard/index.html",
              ".output/public/docs/index.html",
            ]) {
              const html = fs.readFileSync(rel, "utf8");
              const isDocs = rel.endsWith("/docs/index.html");
              if (!html.includes("<html lang=\"id\"") || (!isDocs && !html.includes("<main")) || (isDocs && !html.includes("ORION Telemetry"))) {
                throw new Error(`Invalid prerendered HTML in ${rel}`);
              }
            }

            const htaccess = fs.readFileSync(".output/public/.htaccess", "utf8");
            const requiredHtaccessSnippets = [
              "<FilesMatch",
              "Require all denied",
              "X-Content-Type-Options",
              "AddOutputFilterByType DEFLATE",
              "max-age=31536000, immutable",
              "RewriteRule ^docs/?$ /docs/index.html [L]",
              "^dipo_api/(?:db\\.php|migrate\\.php|.*\\.sql|\\..*)$ - [F,L]",
            ];
            for (const snippet of requiredHtaccessSnippets) {
              if (!htaccess.includes(snippet)) {
                throw new Error(`.output/public/.htaccess missing required rule: ${snippet}`);
              }
            }

            const assetsDir = ".output/public/assets";
            const dashboardChunks = fs
              .readdirSync(assetsDir)
              .filter((f) => /^dashboard-.*\.js$/.test(f));
            if (dashboardChunks.length === 0) {
              throw new Error("Expected initial dashboard-*.js entry chunk in .output/public/assets");
            }
            for (const chunk of dashboardChunks) {
              const sizeBytes = fs.statSync(`${assetsDir}/${chunk}`).size;
              const sizeKb = (sizeBytes / 1024).toFixed(1);
              console.log(`Initial chunk ${chunk}: ${sizeKb} kB`);
              if (sizeBytes >= 450 * 1024) {
                throw new Error(`Initial chunk ${chunk} (${sizeKb} kB) exceeds 450 kB raw budget`);
              }
            }

            const expectedPhp = new Set([
              "db.php",
              "get_data.php",
              "get_live_status.php",
              "simpan_data.php",
              "update_config.php",
              "export_csv.php",
              "export_excel.php",
            ]);
            const actualFiles = new Set(fs.readdirSync(".output/public/dipo_api"));
            for (const f of expectedPhp) {
              if (!actualFiles.has(f)) {
                throw new Error(`Missing whitelisted PHP file: ${f}`);
              }
            }
            for (const f of actualFiles) {
              if (!expectedPhp.has(f)) {
                throw new Error(`Forbidden file packaged into .output/public/dipo_api: ${f}`);
              }
            }

            console.log("Production bundle verification PASSED:", [...actualFiles].sort().join(", "));
          '
