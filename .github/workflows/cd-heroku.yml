name: ORION CD Heroku Production

on:
  workflow_run:
    workflows: ["ORION CI Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-heroku-production
  cancel-in-progress: false

jobs:
  deploy-heroku:
    name: Deploy to Heroku (orion-telemetry-prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Check HEROKU_API_KEY secret availability
        id: check_secret
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "HEROKU_API_KEY secret is not configured in GitHub Repository Secrets. Skipping automated Heroku deployment."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout verified commit with full git history
        if: steps.check_secret.outputs.deployed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Push verified commit to Heroku remote
        if: steps.check_secret.outputs.deployed == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          CLEAN_KEY="$(printf '%s' "$HEROKU_API_KEY" | tr -d '\r\n[:space:]')"
          if [ -z "$CLEAN_KEY" ]; then
            echo "FAIL: HEROKU_API_KEY is empty after trimming whitespace."
            exit 1
          fi

          API_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "https://api.heroku.com/apps/orion-telemetry-prod")
          echo "Heroku Platform API auth check -> HTTP $API_STATUS"
          if [ "$API_STATUS" != "200" ]; then
            echo "FAIL: HEROKU_API_KEY rejected by Heroku Platform API (HTTP $API_STATUS)."
            echo "Verify GitHub Secret HEROKU_API_KEY contains your regenerated Heroku API Key (Account Settings -> API Key -> Reveal, or output of 'heroku authorizations:create')."
            exit 1
          fi

          AUTH_B64="$(printf 'heroku:%s' "$CLEAN_KEY" | base64 | tr -d '\r\n')"
          echo "::add-mask::$AUTH_B64"

          GIT_TERMINAL_PROMPT=0 git \
            -c credential.helper= \
            -c "http.https://git.heroku.com/.extraheader=Authorization: Basic $AUTH_B64" \
            push --force https://git.heroku.com/orion-telemetry-prod.git HEAD:refs/heads/main

      - name: Verify live production routes, API health, and closed exposures
        if: steps.check_secret.outputs.deployed == 'true'
        run: |
          sleep 8

          check_http_200() {
            local url="$1"
            local code
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: Expected HTTP 200 from $url, got $code"
              exit 1
            fi
          }

          check_blocked() {
            local url="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> HTTP $code"
            if [ "$code" != "403" ] && [ "$code" != "404" ]; then
              echo "FAIL: Expected HTTP 403 or 404 from $url, got $code"
              exit 1
            fi
          }

          check_http_200 "https://www.oriontelemetry.tech/"
          check_http_200 "https://www.oriontelemetry.tech/dashboard"
          check_http_200 "https://www.oriontelemetry.tech/docs/"
          check_http_200 "https://www.oriontelemetry.tech/docs/architecture/data-flow-dfd/"
          check_http_200 "https://www.oriontelemetry.tech/docs/hardware/pcb-v2-blueprint-layout/"
          check_http_200 "https://www.oriontelemetry.tech/docs/hardware/electrical-flow/"
          check_http_200 "https://www.oriontelemetry.tech/docs/hardware/electrical-schematic/"
          check_http_200 "https://www.oriontelemetry.tech/docs/raw-md/hardware/pcb-v2-blueprint-layout.md"

          ROOT_HDR=$(curl -sSI -H "Accept-Encoding: gzip" "https://www.oriontelemetry.tech/")
          if ! echo "$ROOT_HDR" | grep -iq "^content-encoding:.*gzip"; then
            echo "FAIL: Expected Content-Encoding: gzip on https://www.oriontelemetry.tech/"
            echo "$ROOT_HDR"
            exit 1
          fi
          echo "Gzip verified on root HTML response"

          DASH_HTML=$(curl -sS -L "https://www.oriontelemetry.tech/dashboard")
          DASH_ASSET=$(echo "$DASH_HTML" | grep -oE '/assets/dashboard-[^"]+\.js' | head -n1 || true)
          if [ -z "$DASH_ASSET" ]; then
            echo "FAIL: Could not find /assets/dashboard-*.js reference in /dashboard HTML"
            exit 1
          fi
          ASSET_HDR=$(curl -sSI -H "Accept-Encoding: gzip" "https://www.oriontelemetry.tech${DASH_ASSET}")
          echo "Asset header check for ${DASH_ASSET}"
          if ! echo "$ASSET_HDR" | grep -iq "^HTTP/.* 200"; then
            echo "FAIL: Expected HTTP 200 for ${DASH_ASSET}"
            echo "$ASSET_HDR"
            exit 1
          fi
          if ! echo "$ASSET_HDR" | grep -iq "^content-encoding:.*gzip"; then
            echo "FAIL: Expected Content-Encoding: gzip on ${DASH_ASSET}"
            echo "$ASSET_HDR"
            exit 1
          fi
          if ! echo "$ASSET_HDR" | grep -iq "^cache-control:.*immutable"; then
            echo "FAIL: Expected Cache-Control immutable on ${DASH_ASSET}"
            echo "$ASSET_HDR"
            exit 1
          fi
          echo "Immutable + Gzip verified on ${DASH_ASSET}"

          HEAD_API_CODE=$(curl -sS -I -o /dev/null -w "%{http_code}" "https://www.oriontelemetry.tech/dipo_api/get_data.php")
          echo "HEAD https://www.oriontelemetry.tech/dipo_api/get_data.php -> HTTP $HEAD_API_CODE"
          if [ "$HEAD_API_CODE" != "200" ]; then
            echo "FAIL: Expected HTTP 200 on HEAD /dipo_api/get_data.php, got $HEAD_API_CODE"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          API_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" "https://www.oriontelemetry.tech/dipo_api/get_data.php?nocache=1")
          echo "https://www.oriontelemetry.tech/dipo_api/get_data.php?nocache=1 -> HTTP $API_CODE"
          if [ "$API_CODE" != "200" ]; then
            rm -f "$BODY_FILE"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (data.status !== "OK") {
              throw new Error(`Expected status === "OK", got ${JSON.stringify(data.status)}`);
            }
            console.log("API live status verified: OK");
          ' "$BODY_FILE"
          rm -f "$BODY_FILE"

          check_blocked "https://www.oriontelemetry.tech/dipo_api/migrate.php"
          check_blocked "https://www.oriontelemetry.tech/dipo_api/schema.sql"
          check_blocked "https://www.oriontelemetry.tech/dipo_api/schema_production.sql"
          check_blocked "https://www.oriontelemetry.tech/dipo_api/db.php"
